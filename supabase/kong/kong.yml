_format_version: "1.1"

services:
  - name: rest
    url: http://rest:3000
    routes:
      - name: rest-all
        paths:
          - /rest
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: true
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - anon
            - authenticated
            - service_role

  - name: auth
    url: http://auth:9999
    routes:
      - name: auth-all
        paths:
          - /auth
    plugins:
      - name: cors

  - name: storage
    url: http://storage:5000
    routes:
      - name: storage-all
        paths:
          - /storage
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: true
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - anon
            - authenticated
            - service_role

